services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: seguimiento-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env (ver .env.example)}"
    ports:
      - "${MSSQL_PORT:-14330}:1433"
    volumes:
      - sqlserver-datos:/var/opt/mssql
      # Los scripts se montan de solo lectura para ejecutarlos con el sqlcmd del contenedor.
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  sqlserver-datos:
