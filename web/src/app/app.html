<header class="barra">
  <span class="marca">Seguimiento de pacientes</span>

  <nav class="navegacion" aria-label="Principal">
    <a
      routerLink="/contactos"
      routerLinkActive="activo"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Contactos del mes
    </a>
    <a routerLink="/contactos/nuevo" routerLinkActive="activo">Registrar contacto</a>
  </nav>

  <div class="actuando-como">
    <label for="gestor-actual">Actuando como</label>
    <select id="gestor-actual" (change)="alCambiarGestor($event)">
      <option value="" [selected]="gestorActual.gestorId() === null">Elige un gestor</option>
      @for (gestor of gestores(); track gestor.id) {
        <option [value]="gestor.id" [selected]="gestor.id === gestorActual.gestorId()">
          {{ gestor.nombre }}
        </option>
      }
    </select>
    <small>Simulación: no hay autenticación.</small>
  </div>
</header>

@if (errorCatalogos(); as error) {
  <p class="alerta alerta-error" role="alert">{{ error }}</p>
}

<main>
  <router-outlet />
</main>
